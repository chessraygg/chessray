<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChessRay Overlay</title>
  <link rel="stylesheet" href="./overlay.css">
</head>
<body>
  <canvas id="video-overlay"></canvas>

  <div class="panel user-panel" id="user-panel">
    <!-- Top bar: always visible — icon toggles + collapse/close -->
    <div class="top-bar" id="cv-main-toggles">
      <button class="toggle icon-toggle active" id="cv-overlay-btn" data-tip="Show/hide actual board overlay (arrows, eval bar)">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8s3-5.5 7-5.5S15 8 15 8s-3 5.5-7 5.5S1 8 1 8z"/><circle cx="8" cy="8" r="2.5"/></svg>
      </button>
      <button class="toggle icon-toggle active" id="cv-vboard-btn" data-tip="Show/hide virtual board overlay (arrows, animation)">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M2 8h12M8 2v12"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/></svg>
      </button>
      <button class="toggle icon-toggle active" id="cv-eval-btn" data-tip="Show eval bar next to detected board">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="1" width="6" height="14" rx="1"/><rect x="5" y="7" width="6" height="8" rx="0" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="toggle icon-toggle active" id="cv-line-btn" data-tip="Show best line as numbered arrows on board">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="14" x2="4" y2="3"/><polygon points="4,1 2,4 6,4" fill="currentColor" stroke="none"/><line x1="12" y1="2" x2="12" y2="13"/><polygon points="12,15 10,12 14,12" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="toggle icon-toggle" id="cv-arrows-btn" data-tip="Show top engine moves as arrows on board">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="13" x2="2" y2="4"/><polygon points="2,2 0.5,5 3.5,5" fill="currentColor" stroke="none"/><line x1="2" y1="13" x2="9" y2="6"/><polygon points="10.5,4.5 7,5.5 8.5,8" fill="currentColor" stroke="none"/><line x1="2" y1="13" x2="13" y2="13"/><polygon points="15,13 12,11.5 12,14.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="toggle icon-toggle" id="cv-auto-btn" data-tip="Auto: show top moves then switch to best line">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><polyline points="8,4 8,8 11,10"/></svg>
      </button>
      <button class="toggle icon-toggle" id="cv-compact-btn" data-tip="Compact mode: board + top moves only">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="9" rx="1"/><line x1="4" y1="13.5" x2="12" y2="13.5"/></svg>
      </button>
      <button class="ctrl-btn" id="cv-zoom-out" data-tip="Zoom out">&#x2212;</button>
      <button class="ctrl-btn" id="cv-zoom-in" data-tip="Zoom in">&#x2B;</button>
      <span data-tip="Expand/Collapse"><button class="ctrl-btn chevron" id="cv-collapse-btn">&#x25BC;</button></span>
      <span data-tip="Close"><button class="ctrl-btn close" id="cv-close-btn">&#xD7;</button></span>
    </div>

    <div class="panel-body" id="cv-panel-body">
      <div class="tracking-content" id="cv-tracking-content">
        <!-- Board -->
        <div class="panel-section" id="sec-board">
          <div class="section-header" data-section="board">Board</div>
          <div class="section-body">
            <div class="board-frame">
              <div class="board-container">
                <div class="piece-grid" id="cv-debug-grid"></div>
                <canvas id="cv-arrow-canvas" width="200" height="200"></canvas>
              </div>
              <div class="compact-moves hidden" id="cv-compact-moves"></div>
              <div class="board-status">
                  <span class="turn-dot white" id="cv-turn-dot"></span>
                  <span id="cv-turn-text">White</span>
                </span>
                <span class="orientation-badge" id="cv-orientation-badge">
                  <span class="orient-arrow" id="cv-pawn-dir"></span>
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Eval -->
        <div class="panel-section" id="sec-eval">
          <div class="section-header" data-section="eval">Eval</div>
          <div class="section-body">
            <div class="eval-bar">
              <div class="eval-bar-fill" id="cv-eval-fill" style="width:50%"></div>
              <div class="eval-bar-label" id="cv-eval-label">0.0</div>
              <div class="eval-bar-depth" id="cv-eval-depth"></div>
            </div>
          </div>
        </div>

        <!-- Lines -->
        <div class="panel-section" id="sec-lines">
          <div class="section-header" data-section="lines">Lines</div>
          <div class="section-body">
            <div class="best-moves" id="cv-best-moves"></div>
          </div>
        </div>

        <!-- Settings -->
        <div class="panel-section" id="sec-settings">
          <div class="section-header" data-section="settings">Settings</div>
          <div class="section-body">
            <div class="pv-depth-row">
              <label data-tip="Max centipawn loss for showing alternative moves">CP loss</label>
              <input type="range" id="cv-loss-threshold" min="0" max="200" value="0" step="10">
              <span id="cv-loss-threshold-val">0</span>
            </div>
            <div class="pv-depth-row" id="cv-pv-depth-row">
              <label data-tip="Number of moves shown in best line">PV depth</label>
              <input type="range" id="cv-pv-depth" min="1" max="10" value="10">
              <span id="cv-pv-depth-val">10</span>
            </div>
            <div class="pv-depth-row">
              <label data-tip="Seconds between adding each new line arrow (starts at 2, grows to max)">Grow</label>
              <input type="range" id="cv-pv-grow-delay" min="1" max="10" value="3" step="1">
              <span id="cv-pv-grow-delay-val">3</span><span style="font-size:8px;color:var(--text-faint)">s</span>
            </div>
            <div class="pv-depth-row">
              <label data-tip="Line arrow colors for white and black moves">Colors</label>
              <input type="color" id="cv-pv-white-color" value="#60a5fa" class="color-pick">
              <input type="color" id="cv-pv-black-color" value="#f9a8d4" class="color-pick">
            </div>
            <div class="pv-depth-row" id="cv-auto-delay-row">
              <label data-tip="Seconds to show top moves before switching to best line">Delay</label>
              <input type="range" id="cv-auto-delay" min="1" max="15" value="5" step="1">
              <span id="cv-auto-delay-val">5</span><span style="font-size:8px;color:var(--text-faint)">s</span>
            </div>
            <div class="pv-depth-row">
              <label data-tip="Maximum engine search depth (higher = stronger but slower)">Engine</label>
              <input type="range" id="cv-max-depth" min="8" max="40" value="28" step="4">
              <span id="cv-max-depth-val">28</span>
            </div>
            <div class="pv-depth-row">
              <label data-tip="Skip recognition when board pixels haven't changed (faster but may miss subtle changes)">Change detect</label>
              <input type="checkbox" id="cv-change-detect" checked>
            </div>
          </div>
        </div>

        <!-- Debug -->
        <div class="panel-section" id="sec-debug">
          <div class="section-header" data-section="debug">Debug</div>
          <div class="section-body debug-section" id="debug-section">
            <div class="toggle-row">
              <button class="toggle" id="cv-border-btn">Box</button>
            </div>
            <img id="cv-debug-img" src="" alt="Board capture">
            <div class="fen" id="cv-debug-fen">Waiting...</div>
            <div class="debug-orient" id="cv-orientation-info"></div>
            <div class="meta" id="cv-debug-info"></div>
          </div>
        </div>

      </div>
      <div class="compact-hint">double-click to expand</div>
    </div>
    <div class="resize-grip bottom-right" id="cv-resize-grip-br"></div>
    <div class="resize-grip bottom-left" id="cv-resize-grip-bl"></div>
    <div class="resize-grip top-right" id="cv-resize-grip-tr"></div>
    <div class="resize-grip top-left" id="cv-resize-grip-tl"></div>
  </div>

  <script type="module" src="./overlay.ts"></script>
</body>
</html>
