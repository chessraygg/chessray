<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChessRay Overlay</title>
  <link rel="stylesheet" href="./overlay.css">
</head>
<body>
  <canvas id="video-overlay"></canvas>

  <div class="panel user-panel" id="user-panel">
    <!-- Top bar: always visible — icon toggles + collapse/close -->
    <div class="top-bar" id="cv-main-toggles">
      <button class="toggle icon-toggle active" id="cv-overlay-btn" data-tip="Show/hide actual board overlay (arrows, eval bar)">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8s3-5.5 7-5.5S15 8 15 8s-3 5.5-7 5.5S1 8 1 8z"/><circle cx="8" cy="8" r="2.5"/></svg>
      </button>
      <button class="toggle icon-toggle active" id="cv-vboard-btn" data-tip="Show/hide virtual board overlay (arrows, animation)">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M2 8h12M8 2v12"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/></svg>
      </button>
      <button class="toggle icon-toggle active" id="cv-eval-btn" data-tip="Show eval bar next to detected board">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="1" width="6" height="14" rx="1"/><rect x="5" y="7" width="6" height="8" rx="0" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="toggle icon-toggle" id="cv-compact-btn" data-tip="Compact mode: board + top moves only">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="12" height="9" rx="1"/><line x1="4" y1="13.5" x2="12" y2="13.5"/></svg>
      </button>
      <button class="ctrl-btn" id="cv-zoom-out" data-tip="Zoom out">&#x2212;</button>
      <button class="ctrl-btn" id="cv-zoom-in" data-tip="Zoom in">&#x2B;</button>
      <span data-tip="Expand/Collapse"><button class="ctrl-btn chevron" id="cv-collapse-btn">&#x25BC;</button></span>
      <span data-tip="Close"><button class="ctrl-btn close" id="cv-close-btn">&#xD7;</button></span>
    </div>

    <div class="panel-body" id="cv-panel-body">
      <div class="split-root" id="cv-split-root"></div>
      <div class="compact-hint" id="cv-compact-hint">double-click to compact</div>
    </div>

    <!-- Section bodies: pre-built DOM. SplitLayout moves them into leaves at runtime.
         IDs inside remain stable so the rest of the app can query them as usual. -->
    <div id="cv-section-library" hidden>
      <div class="section-body" data-section-id="board" data-section-title="Board">
        <div class="board-frame">
          <div class="board-fit" id="cv-board-fit">
            <div class="board-container">
              <div class="piece-grid" id="cv-debug-grid"></div>
              <canvas id="cv-arrow-canvas" width="200" height="200"></canvas>
            </div>
          </div>
          <div class="compact-moves" id="cv-compact-moves"></div>
          <div class="board-status">
              <span class="turn-dot white" id="cv-turn-dot"></span>
              <span id="cv-turn-text">White</span>
            </span>
            <span class="orientation-badge" id="cv-orientation-badge">
              <span class="orient-arrow" id="cv-pawn-dir"></span>
            </span>
          </div>
        </div>
      </div>

      <div class="section-body display-toggles" data-section-id="display" data-section-title="Display">
        <label class="display-toggle"><input type="checkbox" id="cv-disp-overlay" checked><span>Board overlay</span></label>
        <label class="display-toggle"><input type="checkbox" id="cv-disp-vboard" checked><span>Virtual board</span></label>
        <label class="display-toggle"><input type="checkbox" id="cv-disp-eval" checked><span>Eval bar</span></label>
      </div>

      <div class="section-body" data-section-id="eval" data-section-title="Eval">
        <div class="eval-bar">
          <div class="eval-bar-fill" id="cv-eval-fill" style="width:50%"></div>
          <div class="eval-bar-label" id="cv-eval-label">0.0</div>
          <div class="eval-bar-depth" id="cv-eval-depth"></div>
        </div>
      </div>

      <div class="section-body" data-section-id="lines" data-section-title="Lines">
        <div class="best-moves" id="cv-best-moves"></div>
      </div>

      <div class="section-body" data-section-id="lichess" data-section-title="Lichess">
        <div class="lichess-controls">
          <button class="toggle-btn" id="cv-lichess-btn" data-tip="Open floating Lichess analysis board">&#9816; Analysis board</button>
          <label class="lichess-sync-label"><input type="checkbox" id="cv-lichess-sync" checked><span>Auto-sync position</span></label>
        </div>
      </div>

      <div class="section-body" data-section-id="settings" data-section-title="Settings">
        <div class="pv-depth-row">
          <label data-tip="Max centipawn loss for showing alternative moves">CP loss</label>
          <input type="range" id="cv-loss-threshold" min="0" max="500" value="0" step="10">
          <span id="cv-loss-threshold-val">0</span>
        </div>
        <div class="pv-depth-row" id="cv-pv-depth-row">
          <label data-tip="Number of moves to play through in the best-line piece animation">PV depth</label>
          <input type="range" id="cv-pv-depth" min="1" max="11" value="10">
          <span id="cv-pv-depth-val">10</span>
        </div>
        <div class="pv-depth-row">
          <label data-tip="Lower bound of the auto-tuned frame capture rate. The system can drop to this floor when frames consistently exceed the budget.">FPS min</label>
          <input type="range" id="cv-fps-min" min="1" max="5" value="1" step="1">
          <span id="cv-fps-min-val">1</span>
        </div>
        <div class="pv-depth-row">
          <label data-tip="Upper bound of the auto-tuned frame capture rate. The system can climb to this ceiling when fresh (non-cached) frames stay well under budget.">FPS max</label>
          <input type="range" id="cv-fps-max" min="1" max="5" value="5" step="1">
          <span id="cv-fps-max-val">5</span>
        </div>
        <div class="pv-depth-row">
          <label data-tip="Seconds between each move in the best-line piece animation">Grow</label>
          <input type="range" id="cv-pv-grow-delay" min="1" max="10" value="3" step="1">
          <span id="cv-pv-grow-delay-val">3</span><span style="font-size:8px;color:var(--text-faint)">s</span>
        </div>
        <div class="pv-depth-row">
          <label data-tip="Seconds the preview phase stays visible (selected move highlighted, others hidden) before the per-step PV piece animation begins.">Preview</label>
          <input type="range" id="cv-pv-preview-sec" min="0" max="5" value="1" step="1">
          <span id="cv-pv-preview-sec-val">1</span><span style="font-size:8px;color:var(--text-faint)">s</span>
        </div>
        <div class="pv-depth-row">
          <label data-tip="Seconds to wait after position stabilizes before showing moves (0 = instant)">Wait</label>
          <input type="range" id="cv-show-moves-delay" min="0" max="10" value="0" step="1">
          <span id="cv-show-moves-delay-val">0</span><span style="font-size:8px;color:var(--text-faint)">s</span>
        </div>
        <div class="pv-depth-row">
          <label data-tip="After showing top moves, automatically play the best line piece-by-piece on the virtual board.">PV autoplay</label>
          <input type="checkbox" id="cv-pv-autoplay">
        </div>
        <div class="pv-depth-row" id="cv-auto-delay-row">
          <label data-tip="Seconds to show top moves before switching to best line">Delay</label>
          <input type="range" id="cv-auto-delay" min="1" max="15" value="5" step="1">
          <span id="cv-auto-delay-val">5</span><span style="font-size:8px;color:var(--text-faint)">s</span>
        </div>
        <div class="pv-depth-row">
          <label data-tip="Maximum engine search depth (higher = stronger but slower)">Engine</label>
          <input type="range" id="cv-max-depth" min="8" max="40" value="28" step="4">
          <span id="cv-max-depth-val">28</span>
        </div>
        <div class="pv-depth-row">
          <label data-tip="Max engine lines (starts at 2, ramps up as position stays)">Lines</label>
          <input type="range" id="cv-multi-pv-max" min="1" max="8" value="5" step="1">
          <span id="cv-multi-pv-max-val">5</span>
        </div>
        <div class="pv-depth-row">
          <label data-tip="Depth steps before adding another engine line (higher = slower ramp)">Ramp</label>
          <input type="range" id="cv-multi-pv-ramp" min="1" max="4" value="1" step="1">
          <span id="cv-multi-pv-ramp-val">1</span>
        </div>
        <div class="pv-depth-row">
          <label data-tip="Skip recognition when board pixels haven't changed (faster but may miss subtle changes)">Change detect</label>
          <input type="checkbox" id="cv-change-detect" checked>
        </div>
        <div class="pv-depth-row">
          <label data-tip="Best-move arrow width (pixels at the canonical board size). Other ranks scale proportionally.">Arrow size</label>
          <input type="range" id="cv-arrow-max-width" min="3" max="10" value="5" step="1">
          <span id="cv-arrow-max-width-val">5</span>
        </div>
        <div class="pv-depth-row">
          <label data-tip="Uniform opacity applied to every arrow (color still carries quality).">Arrow opacity</label>
          <input type="range" id="cv-arrow-max-opacity" min="20" max="100" value="85" step="5">
          <span id="cv-arrow-max-opacity-val">85</span><span style="font-size:8px;color:var(--text-faint)">%</span>
        </div>
      </div>

      <div class="section-body debug-section" id="debug-section" data-section-id="debug" data-section-title="Debug">
        <div class="debug-history-nav" id="cv-debug-history-nav" style="display:none"></div>
        <div class="debug-img-wrap" id="cv-debug-img-wrap">
          <img id="cv-debug-img" src="" alt="Board capture" data-tip="JPEG preview of the cropped board pixels actually fed into the recognition pipeline. Useful for verifying the bbox is on the board and not on adjacent UI." data-tip-pos="below">
        </div>
        <div class="pv-depth-row">
          <label data-tip="Resize the board preview image (percent of panel width). Doesn't affect detection — preview only.">Img size</label>
          <input type="range" id="cv-debug-img-scale" min="25" max="200" value="100" step="5">
          <span id="cv-debug-img-scale-val">100</span><span style="font-size:8px;color:var(--text-faint)">%</span>
        </div>
        <div class="fen" id="cv-debug-fen" data-tip="Full FEN of the recognized position (with side to move, castling rights, en passant, halfmove clock and fullmove number) once eval has run; otherwise position-only.">Waiting...</div>
        <div class="debug-orient" id="cv-orientation-info" data-tip="Detected board orientation (white at top vs bottom) and the signal that decided it: coord labels (OCR), pawn move direction, or piece-count heuristic."></div>
        <div class="meta" id="cv-debug-info"></div>
        <div class="detection-status" id="cv-detection-status" style="display:none" data-tip="Why the latest frame wasn't fully processed (e.g. mid-animation, low confidence, no highlights, intermediate frame)."></div>
        <div class="highlight-debug" id="cv-highlight-debug"></div>
        <div class="toggle-row">
          <button class="toggle" id="cv-border-btn" data-tip="Draw a green rectangle around the detected board on the actual screen. Useful for verifying the bbox visually.">Box</button>
          <button class="toggle" id="cv-copy-debug-btn" data-tip="Copy all debug details for the current view (live frame or selected history entry) to the clipboard as Markdown + JSON.">Copy</button>
          <button class="toggle" id="cv-record-btn" data-tip="Dump raw captured frames to ~/chessray-recordings/ for test fixtures">● Record</button>
        </div>
      </div>
    </div>
    <div class="resize-grip bottom-right" id="cv-resize-grip-br"></div>
    <div class="resize-grip bottom-left" id="cv-resize-grip-bl"></div>
    <div class="resize-grip top-right" id="cv-resize-grip-tr"></div>
    <div class="resize-grip top-left" id="cv-resize-grip-tl"></div>
  </div>

  <script type="module" src="./overlay.ts"></script>
</body>
</html>
