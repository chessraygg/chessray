<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>v2 — Sidecar</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="./v2.css">
</head>
<body>
  <div class="playground-label">
    chessray · v2 — sidecar
    <a href="./index.html">← back</a>
    <a href="./drawer.html">drawer →</a>
  </div>

  <div class="r2" id="panel">
    <div class="r2-col">
      <div class="r2-head">
        <span class="r2-turn b"></span>
        <span class="r2-meta"><b>d24</b> · <b>5</b> lines · <b>3.2</b> fps</span>
        <span class="r2-spacer"></span>
        <button class="r2-btn" id="btn-settings" title="Settings">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2"/><path d="M13.4 9.5l1.4 1.1-1.4 2.4-1.7-.5a5.6 5.6 0 0 1-1.4.8l-.4 1.7H7.1l-.4-1.7a5.6 5.6 0 0 1-1.4-.8l-1.7.5-1.4-2.4 1.4-1.1a5.6 5.6 0 0 1 0-1.6L2.2 6.6 3.6 4.2l1.7.5a5.6 5.6 0 0 1 1.4-.8l.4-1.7h2.8l.4 1.7c.5.2 1 .5 1.4.8l1.7-.5 1.4 2.4-1.4 1.1c.1.5.1 1.1 0 1.6z"/></svg>
        </button>
        <button class="r2-btn" id="btn-debug" title="Diagnostics">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="6" height="8" rx="3"/><path d="M2 6h2M2 9h2M2 12h2M12 6h2M12 9h2M12 12h2M8 2v3M5 4l-1-1M11 4l1-1"/></svg>
        </button>
        <button class="r2-btn" title="Hide panel">−</button>
        <button class="r2-btn danger" title="Close">×</button>
      </div>
      <div class="r2-moves" id="view-moves"></div>
    </div>

    <!-- secondary column (sidecar) -->
    <div class="r2-side">
      <div class="r2-surface" id="side-settings" style="display:none">
        <div class="r2-surface-head">
          <span class="r2-surface-title">Settings</span>
          <span class="r2-spacer" style="flex:1"></span>
          <button class="r2-back" data-close>×</button>
        </div>
        <div id="settings-body"></div>
      </div>
      <div class="r2-surface" id="side-debug" style="display:none">
        <div class="r2-surface-head">
          <span class="r2-surface-title">Diagnostics</span>
          <span class="r2-spacer" style="flex:1"></span>
          <button class="r2-back" data-close>×</button>
        </div>
        <div id="debug-body" style="padding:8px 10px"></div>
      </div>
    </div>
  </div>

  <script src="./mock-data.js"></script>
  <script src="./render.js"></script>
  <script>
    renderMoves('#view-moves');
    renderSettings('#settings-body');
    renderDebug('#debug-body');

    const panel    = document.querySelector('#panel');
    const sSet     = document.querySelector('#side-settings');
    const sDbg     = document.querySelector('#side-debug');
    const bSet     = document.querySelector('#btn-settings');
    const bDbg     = document.querySelector('#btn-debug');
    function open(name) {
      sSet.style.display = name === 'settings' ? 'flex' : 'none';
      sDbg.style.display = name === 'debug'    ? 'flex' : 'none';
      const has = !!name;
      panel.classList.toggle('has-side', has);
      bSet.classList.toggle('active', name === 'settings');
      bDbg.classList.toggle('active', name === 'debug');
    }
    bSet.addEventListener('click', () => open(bSet.classList.contains('active') ? null : 'settings'));
    bDbg.addEventListener('click', () => open(bDbg.classList.contains('active') ? null : 'debug'));
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => open(null)));
  </script>
</body>
</html>
