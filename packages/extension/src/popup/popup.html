<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chessray</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        width: 320px;
        min-height: 500px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: #171717;
        color: #e5e5e5;
      }
      /* Mini Start/Stop strip above the panel. Capture lifecycle controls
         live here because the panel itself doesn't have a "begin capture"
         affordance — Electron auto-starts; the extension needs an explicit
         user-gesture click to grant tabCapture. */
      #cap-bar {
        display: flex; gap: 6px; align-items: center;
        padding: 8px 10px;
        border-bottom: 1px solid #272727;
        background: rgba(0, 0, 0, 0.25);
      }
      #cap-bar button {
        flex: 1; padding: 6px 10px;
        font: inherit; font-size: 11px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid #272727;
        color: #e5e5e5;
        border-radius: 4px;
        cursor: pointer;
      }
      #cap-bar button:hover { border-color: #22c55e; color: #22c55e; }
      #cap-bar button.running { color: #22c55e; border-color: #22c55e; background: rgba(34,197,94,0.10); }
      #cap-status { font-size: 10px; color: #737373; min-width: 0; flex-basis: 100%; }
      /* The mounted panel sits inside #panel-host; mountOverlay() injects
         everything (eval bar, board, move list, settings, diagnostics). */
      .panel.user-panel {
        position: static !important;
        width: 100% !important;
        height: auto !important;
        max-height: none;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <div id="cap-bar">
      <button id="start">Start on this tab</button>
      <button id="stop">Stop</button>
      <div id="cap-status"></div>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
